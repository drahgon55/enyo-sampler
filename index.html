<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Enyo 2.7 Sampler</title>

<!-- There is no loader, so the sheets this page uses are listed by hand:
     enyo's base plus the three enyo modules the shell reaches for, then
     layout's and onyx's complete compiled sheets. The samples themselves run
     in frames and bring their own. -->
<link rel="stylesheet" href="/enyo/css/enyo.css">
<link rel="stylesheet" href="/enyo/src/Scroller/Scroller.css">
<link rel="stylesheet" href="/enyo/src/ScrollThumb/ScrollThumb.css">
<link rel="stylesheet" href="/enyo/src/ToolDecorator/ToolDecorator.css">
<link rel="stylesheet" href="/layout/css/layout.css">
<link rel="stylesheet" href="/onyx/css/onyx.css">
<link rel="stylesheet" href="Sampler.css">

<!--
	No bundler and no build step: the browser resolves the bare specifiers
	through the map below. Like every page in these forks it wants the `enyo`,
	`layout` and `onyx` checkouts side by side under the served root, so serve
	their common parent -- the directory that HOLDS them, not one of them:

		python3 layout/test-layout/serve.py 8000 /path/that/holds/them

	then open http://localhost:8000/enyo-sampler/index.html

	Use serve.py rather than `python3 -m http.server`: the latter lets the
	browser cache ES modules, so a reload can re-run stale code.
-->
<script type="importmap">
{ "imports": {
  "enyo":    "/enyo/index.js",
  "enyo/":   "/enyo/",
  "layout":  "/layout/index.js",
  "layout/": "/layout/",
  "onyx":    "/onyx/index.js",
  "onyx/":   "/onyx/"
} }
</script>

<style>
 /* For the failure notice below, and for the moment before the shell paints. */
 .boot {
   font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
   color: #9AA0A6; margin: 0; padding: 24px; white-space: pre-wrap;
 }
 .boot-fail { color: #C5221F; }
</style>
</head>
<!-- `onyx` scopes onyx's own typography rules, the same way its sample pages
     get them. -->
<body class="onyx enyo-unselectable">

<pre id="boot" class="boot">loading the sampler…</pre>

<!-- A module that fails to LINK never runs, so the module script below could
     not report its own failure and the page would sit there blank. This
     classic script turns that silence into something readable -- and the most
     likely cause by far is a server rooted in the wrong place, so it says so.
     -->
<script>
window.addEventListener('error', function (e) {
	document.title = 'FAIL (load)';
	var boot = document.getElementById('boot');
	if (!boot) { return; }
	boot.className = 'boot boot-fail';
	boot.textContent = 'The sampler did not load: ' + e.message +
		'\n\nThe usual cause is the server being rooted inside one repository ' +
		'instead of the directory that holds them all. enyo, layout and onyx ' +
		'have to sit side by side under the served root:' +
		'\n\n    python3 layout/test-layout/serve.py 8000 /path/that/holds/them';
});
</script>

<script type="module">
import ready from 'enyo/src/ready.js';
import loadManifests from './manifests.js';
import Sampler from './Sampler.js';

// Read all three manifests before building anything: the shell wants the
// whole list up front, and it is the one place a missing checkout shows up.
const libraries = await loadManifests();

ready(function () {
	const boot = document.getElementById('boot');
	if (boot) { boot.parentNode.removeChild(boot); }
	new Sampler({libraries: libraries}).renderInto(document.body);
});
</script>
</body>
</html>
